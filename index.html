<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsline Live</title>
  <meta name="description" content="Live headlines from India and around the world, updated automatically.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before the page paints (avoids a flash).
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="logo" href="/">Newsline<span>.</span></a>

      <div class="live" id="live" title="Live connection status">   
        <span class="live-dot"></span>
        <span class="live-label">LIVE</span>
        <span class="live-time" id="updated">Connecting…</span>
      </div>

      <form class="search" id="search-form" role="search">
        <label for="search" class="sr-only">Search news</label>
        <input id="search" type="search" placeholder="Search headlines" autocomplete="off">
      </form>

      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>

    <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  </header>

  <button class="new-pill" id="new-pill" type="button" hidden></button>

  <main class="page">
    <p class="date-line" id="date-line"></p>
    <div id="feed" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <p>Headlines and summaries belong to their publishers. Click any story to read it on the original website.</p>
    <p id="sources"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
